name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check required files
        run: |
          ls -la
          for f in www/index.html icon.png make_icons.py capacitor.config.json package.json debug.keystore; do
            test -f "$f" || { echo "Missing file: $f"; exit 1; }
          done

      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: npm install
      - run: npx cap add android

      - name: Allow camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>|' $M
          grep -n CAMERA $M || true

      - run: python -m pip install pillow
      - name: Make app icon
        run: python make_icons.py

      - name: Set app name
        run: |
          F=android/app/src/main/res/values/strings.xml
          sed -i 's|name="app_name">[^<]*<|name="app_name">WataPickle Matcher<|; s|name="title_activity_main">[^<]*<|name="title_activity_main">WataPickle Matcher<|' $F
          grep -E "app_name|title_activity" $F || true
          ls android/app/src/main/res/mipmap-xxxhdpi

      - name: Set version number (rises with every build)
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$G"
          grep -n -E "versionCode|versionName" "$G"

      - name: Stamp build number into the app (for the update notice)
        run: |
          sed -i "s/const APP_BUILD=[0-9]*;/const APP_BUILD=${{ github.run_number }};/" www/index.html
          grep -n "const APP_BUILD" www/index.html
          grep -q "const APP_BUILD=${{ github.run_number }};" www/index.html || { echo "ERROR: www/index.html must contain the line: const APP_BUILD=0;"; exit 1; }

      - name: Use the fixed signing key (lets new builds install over old ones)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
          keytool -list -v -keystore ~/.android/debug.keystore -storepass android | grep -E "Alias name|SHA256"

      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug

      - name: Confirm the APK was signed with the fixed key
        run: |
          A=android/app/build/outputs/apk/debug/app-debug.apk
          AS=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner
          WANT=$(keytool -list -v -keystore debug.keystore -storepass android | grep "SHA256:" | head -1 | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          GOT=$("$AS" verify --print-certs "$A" | grep -i "certificate SHA-256" | head -1 | sed 's/.*: *//' | tr -d ':' | tr 'A-F' 'a-f')
          echo "keystore SHA-256: $WANT"
          echo "APK signed with:  $GOT"
          if [ -n "$GOT" ] && [ "$WANT" != "$GOT" ]; then echo "::warning::APK was NOT signed with debug.keystore, so it will not install over older builds"; fi

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WataPickle-Matcher-build${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: WataPickle-Matcher-APK
          path: WataPickle-Matcher-build${{ github.run_number }}.apk
          if-no-files-found: error
