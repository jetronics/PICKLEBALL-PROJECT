name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required files
        run: |
          for f in www/index.html icon.png make_icons.py capacitor.config.json package.json debug.keystore; do
            test -f "$f" || { echo "Missing file: $f"; exit 1; }
          done

      - name: Stamp the build number into the app
        run: |
          sed -i "s/const APP_BUILD=[0-9]*;/const APP_BUILD=${{ github.run_number }};/" www/index.html
          grep -q "const APP_BUILD=${{ github.run_number }};" www/index.html || { echo "Could not stamp APP_BUILD in www/index.html"; exit 1; }
          grep -o "const APP_BUILD=[0-9]*" www/index.html

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install Capacitor
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Make launcher icons
        run: |
          pip install pillow
          python3 make_icons.py android/app/src/main/res

      - name: Allow camera (for avatar photos)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' "$M"
          grep -n "CAMERA" "$M"

      - name: Set version number
        run: |
          G=android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" "$G"
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.${{ github.run_number }}\"/" "$G"
          grep -n -E "versionCode|versionName" "$G"

      - name: Use the fixed signing key
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify signing key and version
        run: |
          SDK="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          BT=$(ls -d "$SDK"/build-tools/* | sort -V | tail -1)
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          WANT=$(keytool -list -v -keystore debug.keystore -storepass android | grep -m1 "SHA256:" | sed 's/.*SHA256: *//' | tr -d ':' | tr 'A-F' 'a-f')
          GOT=$("$BT/apksigner" verify --print-certs "$APK" | grep -m1 "certificate SHA-256 digest" | sed 's/.*: *//' | tr 'A-F' 'a-f')
          PKG=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package: name='\([^']*\)'.*/\1/p" | head -1)
          VC=$("$BT/aapt2" dump badging "$APK" | sed -n "s/^package:.* versionCode='\([0-9]*\)'.*/\1/p" | head -1)
          {
            echo "### APK check"
            echo "- Package: \`$PKG\`"
            echo "- versionCode: \`$VC\` (build ${{ github.run_number }})"
            echo "- Signing key SHA-256: \`$GOT\`"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          [ -n "$WANT" ] && [ "$GOT" = "$WANT" ] || { echo "::error::APK is NOT signed with debug.keystore (wanted $WANT, got $GOT). Phones would refuse to update."; exit 1; }
          [ "$VC" = "${{ github.run_number }}" ] || { echo "::error::versionCode is $VC, expected ${{ github.run_number }}."; exit 1; }
          [ "$PKG" = "com.openplay.manager" ] || { echo "::error::Package name is $PKG."; exit 1; }

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk WataPickle-build${{ github.run_number }}.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: watapickle-apk
          path: WataPickle-build${{ github.run_number }}.apk
          if-no-files-found: error
