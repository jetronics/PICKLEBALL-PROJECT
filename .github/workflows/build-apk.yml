name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      KS_FILE: watapickle-release.p12
      KS_ALIAS: watapickle
      KS_PASS: lR2aukrwaxhZtQOArT9h
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check signing key
        run: |
          if [ ! -f "$KS_FILE" ]; then
            echo "::error::watapickle-release.p12 is missing. Upload it to the main folder of the repository."
            exit 1
          fi
      - name: Stamp build number
        run: |
          sed -i "s/const APP_BUILD=0;/const APP_BUILD=${{ github.run_number }};/" www/index.html
          grep -o "const APP_BUILD=[0-9]*" www/index.html
      - run: npm install
      - run: npx cap add android
      - name: Allow camera
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>|' $M
          grep -n CAMERA $M || true
      - run: python -m pip install pillow
      - name: Make app icon
        run: python make_icons.py
      - name: Set app name
        run: |
          F=android/app/src/main/res/values/strings.xml
          sed -i 's|name="app_name">[^<]*<|name="app_name">WataPickle Matcher<|; s|name="title_activity_main">[^<]*<|name="title_activity_main">WataPickle Matcher<|' $F
          grep -E "app_name|title_activity" $F || true
          ls android/app/src/main/res/mipmap-xxxhdpi
      - name: Set version
        run: |
          F=android/app/build.gradle
          CODE=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode [0-9][0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $F
          sed -i '/namespace /a\    lint { checkReleaseBuilds false }' $F
          grep -nE "versionCode|versionName|lint" $F
      - run: npx cap sync android
      - name: Build
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleRelease || ./gradlew assembleDebug
      - name: Sign with the permanent key
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk 2>/dev/null | head -1 || true)
          if [ -z "$APK" ]; then APK=$(ls android/app/build/outputs/apk/debug/*.apk | head -1); fi
          echo "Signing $APK"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/zipalign" -f -p 4 "$APK" aligned.apk
          "$BT/apksigner" sign --ks "$KS_FILE" --ks-type PKCS12 --ks-key-alias "$KS_ALIAS" --ks-pass env:KS_PASS --key-pass env:KS_PASS --out WataPickle-Matcher.apk aligned.apk
          "$BT/apksigner" verify --print-certs WataPickle-Matcher.apk | grep -E "Verifies|SHA-256"
      - uses: actions/upload-artifact@v4
        with:
          name: WataPickle-Matcher-APK
          path: WataPickle-Matcher.apk
