rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {

    // Each person's profile. Anyone signed in can read; only the owner can write.
    match /users/{uid} {
      allow read: if request.auth != null;
      allow create: if request.auth != null
                    && request.auth.uid == uid
                    && get(/databases/$(database)/documents/accounts/$(request.resource.data.accountNo)).data.uid == request.auth.uid;
      allow update: if request.auth != null
                    && request.auth.uid == uid
                    && request.resource.data.accountNo == resource.data.accountNo;

      // Open play history: only the owner can read or write their own entries.
      match /history/{entryId} {
        allow read, create, update: if request.auth != null && request.auth.uid == uid;
      }
    }

    // Account numbers are claimed once and can never be taken or changed.
    match /accounts/{no} {
      allow read: if request.auth != null;
      allow create: if request.auth != null && request.resource.data.uid == request.auth.uid;
    }

    // App settings such as the latest build number. Anyone can read; nobody can write from the app.
    // (Edit these documents in the Firebase console.)
    match /config/{doc} {
      allow read: if true;
      allow write: if false;
    }

    // Rooms. Only the host can change the session, close or delete the room.
    match /rooms/{roomId} {
      allow read: if request.auth != null;
      allow create: if request.auth != null
                    && request.resource.data.hostUid == request.auth.uid;
      allow update: if request.auth != null
                    && resource.data.hostUid == request.auth.uid
                    && request.resource.data.hostUid == resource.data.hostUid;
      allow delete: if request.auth != null
                    && resource.data.hostUid == request.auth.uid;

      // Members: people can add or remove only themselves; the host can remove anyone.
      match /members/{memberUid} {
        allow read: if request.auth != null;
        allow create, update: if request.auth != null && request.auth.uid == memberUid;
        allow delete: if request.auth != null
                      && (request.auth.uid == memberUid
                          || get(/databases/$(database)/documents/rooms/$(roomId)).data.hostUid == request.auth.uid);
      }

      // Calls: only the host can call a player. The called player can only mark it as answered.
      match /calls/{callUid} {
        allow read: if request.auth != null
                    && (request.auth.uid == callUid
                        || get(/databases/$(database)/documents/rooms/$(roomId)).data.hostUid == request.auth.uid);
        allow create, update, delete: if request.auth != null
                    && get(/databases/$(database)/documents/rooms/$(roomId)).data.hostUid == request.auth.uid;
        allow update: if request.auth != null
                    && request.auth.uid == callUid
                    && request.resource.data.diff(resource.data).affectedKeys().hasOnly(['ackAt']);
      }

      // Chat: only people who joined the room can read or write. Host can delete messages.
      match /messages/{msgId} {
        allow read: if request.auth != null
                    && exists(/databases/$(database)/documents/rooms/$(roomId)/members/$(request.auth.uid));
        allow create: if request.auth != null
                      && exists(/databases/$(database)/documents/rooms/$(roomId)/members/$(request.auth.uid))
                      && request.resource.data.uid == request.auth.uid
                      && request.resource.data.text is string
                      && request.resource.data.text.size() > 0
                      && request.resource.data.text.size() <= 300;
        allow delete: if request.auth != null
                      && get(/databases/$(database)/documents/rooms/$(roomId)).data.hostUid == request.auth.uid;
      }
    }
  }
}
